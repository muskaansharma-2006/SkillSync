services:
  # Backend Node.js Express API Service
  - type: web
    name: skillsync-api
    env: node
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false

  # Frontend Static Site
  - type: static
    name: skillsync-frontend
    buildCommand: ""
    publishPath: ./
